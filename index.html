<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>MBTI 性格测评</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --grad-1: #667eea;
    --grad-2: #764ba2;
    --card-shadow: 0 20px 60px rgba(0,0,0,.15);
    --radius: 20px;
    --transition: .4s cubic-bezier(.4,0,.2,1);
  }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-attachment: fixed;
    overflow: hidden;
  }

  /* ===== 通用卡片容器 ===== */
  .card {
    width: 680px;
    max-height: 90vh;
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    padding: 48px 52px;
    overflow-y: auto;
    position: relative;
  }
  .card::-webkit-scrollbar { width: 6px; }
  .card::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  /* ===== 页面切换 ===== */
  .page { display: none; animation: fadeIn .5s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-30px); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes drawRadar { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

  /* ===== 欢迎页 ===== */
  .welcome-icon { font-size: 64px; text-align: center; margin-bottom: 16px; }
  .welcome-title { font-size: 30px; font-weight: 700; text-align: center; color: #333; margin-bottom: 12px; }
  .welcome-subtitle { font-size: 15px; color: #888; text-align: center; line-height: 1.8; margin-bottom: 36px; }
  .welcome-features { display: flex; justify-content: center; gap: 24px; margin-bottom: 40px; }
  .welcome-feature { text-align: center; }
  .welcome-feature .icon { font-size: 28px; margin-bottom: 6px; }
  .welcome-feature .label { font-size: 13px; color: #999; }

  /* ===== 按钮 ===== */
  .btn {
    display: block;
    width: 280px;
    height: 52px;
    margin: 0 auto;
    border: none;
    border-radius: 26px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--grad-1), var(--grad-2));
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 8px 24px rgba(102,126,234,.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(102,126,234,.5); }
  .btn:active { transform: translateY(0); }
  .btn-secondary {
    background: #f0f0f5;
    color: #666;
    box-shadow: none;
    font-weight: 500;
  }
  .btn-secondary:hover { background: #e8e8f0; box-shadow: 0 4px 12px rgba(0,0,0,.08); }

  /* ===== 进度条 ===== */
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .progress-bar { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--grad-1), var(--grad-2)); border-radius: 4px; transition: width .4s ease; }
  .progress-text { font-size: 14px; color: #aaa; white-space: nowrap; }

  /* ===== 答题页 ===== */
  .question-num { font-size: 14px; color: var(--grad-1); font-weight: 600; margin-bottom: 10px; }
  .question-text { font-size: 22px; font-weight: 600; color: #333; line-height: 1.6; margin-bottom: 32px; }

  .option-group { margin-bottom: 24px; }
  .option-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .option-choice {
    flex: 1;
    padding: 18px 20px;
    border: 2px solid #e8e8f0;
    border-radius: 14px;
    font-size: 15px;
    color: #555;
    cursor: pointer;
    transition: var(--transition);
    text-align: center;
    line-height: 1.5;
    position: relative;
  }
  .option-choice:hover { border-color: var(--grad-1); background: #f8f9ff; }
  .option-choice.selected {
    border-color: var(--grad-1);
    background: linear-gradient(135deg, rgba(102,126,234,.08), rgba(118,75,162,.08));
    color: #333;
    font-weight: 600;
  }
  .option-choice.selected::after {
    content: "✓";
    position: absolute;
    top: 8px;
    right: 10px;
    color: var(--grad-1);
    font-size: 16px;
  }

  .strength-row { display: none; margin-top: 4px; }
  .strength-row.show { display: block; animation: slideIn .3s ease; }
  .strength-label { font-size: 13px; color: #aaa; margin-bottom: 10px; text-align: center; }
  .strength-options { display: flex; gap: 12px; justify-content: center; }
  .strength-btn {
    padding: 10px 28px;
    border: 2px solid #e8e8f0;
    border-radius: 10px;
    font-size: 14px;
    color: #666;
    cursor: pointer;
    transition: var(--transition);
  }
  .strength-btn:hover { border-color: var(--grad-1); }
  .strength-btn.selected {
    border-color: var(--grad-1);
    background: var(--grad-1);
    color: #fff;
    font-weight: 600;
  }

  /* ===== 结果页 ===== */
  .result-type-box { text-align: center; margin-bottom: 20px; animation: popIn .6s ease; }
  .result-type { font-size: 56px; font-weight: 800; letter-spacing: 4px; background: linear-gradient(135deg, var(--grad-1), var(--grad-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .result-type-name { font-size: 18px; color: #888; margin-top: 4px; }

  .result-radar { display: flex; justify-content: center; margin: 24px 0 28px; }
  .result-percentages { display: flex; justify-content: center; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
  .pct-item { text-align: center; min-width: 110px; }
  .pct-label { font-size: 13px; color: #aaa; margin-bottom: 4px; }
  .pct-bar-wrap { width: 100%; height: 8px; background: #f0f0f5; border-radius: 4px; overflow: hidden; margin-bottom: 6px; display: flex; }
  .pct-bar-left { height: 100%; background: var(--grad-1); border-radius: 4px 0 0 4px; transition: width .8s ease; }
  .pct-bar-right { height: 100%; background: var(--grad-2); border-radius: 0 4px 4px 0; transition: width .8s ease; margin-left: auto; }
  .pct-values { font-size: 13px; color: #666; }
  .pct-values strong { color: var(--grad-1); }

  .result-section { margin-bottom: 20px; }
  .result-section h3 { font-size: 16px; color: var(--grad-1); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .result-section p { font-size: 15px; color: #555; line-height: 1.85; }
  .result-section ul { list-style: none; padding: 0; }
  .result-section ul li { font-size: 15px; color: #555; line-height: 1.85; padding-left: 18px; position: relative; }
  .result-section ul li::before { content: "•"; position: absolute; left: 4px; color: var(--grad-1); font-size: 18px; line-height: 1.5; }

  .result-actions { display: flex; gap: 16px; margin-top: 36px; justify-content: center; }

  /* ===== 雷达图 SVG ===== */
  .radar-svg text { font-size: 13px; fill: #888; }
  .radar-svg .axis { stroke: #e0e0e8; stroke-width: 1; }
  .radar-svg .grid { stroke: #e8e8f0; stroke-width: 1; fill: rgba(102,126,234,.08); }
  .radar-svg .data-line { stroke: var(--grad-1); stroke-width: 2.5; fill: rgba(102,126,234,.15); }
  .radar-svg .data-dot { fill: var(--grad-1); }
</style>
</head>

// ===== 状态 =====
let currentIdx = 0;
let answers = []; // {choice:'a'|'b', strength:1|2|3}
let selectedChoice = null;

function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentIdx = 0;
  answers = [];
  switchPage('page-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIdx];
  selectedChoice = answers[currentIdx] ? answers[currentIdx].choice : null;
  const hasStrength = answers[currentIdx] && answers[currentIdx].strength != null;

  // 进度
  const progress = Math.round((currentIdx) / 28 * 100);
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressText').textContent = `${currentIdx + 1} / 28`;

  const area = document.getElementById('questionArea');
  area.innerHTML = `
    <div style="animation: slideIn .4s ease;">
      <div class="question-num">第 ${currentIdx + 1} 题</div>
      <div class="question-text">以下哪个描述更接近你？</div>
      <div class="option-group">
        <div class="option-row">
          <div class="option-choice ${selectedChoice==='a'?'selected':''}" onclick="selectChoice('a')">${q.a}</div>
        </div>
        <div class="option-row">
          <div class="option-choice ${selectedChoice==='b'?'selected':''}" onclick="selectChoice('b')">${q.b}</div>
        </div>
      </div>
      <div class="strength-row ${selectedChoice?'show':''}" id="strengthRow">
        <div class="strength-label">你的偏好程度是？</div>
        <div class="strength-options">
          <div class="strength-btn ${hasStrength&&answers[currentIdx].strength===1?'selected':''}" onclick="selectStrength(1)">轻微</div>
          <div class="strength-btn ${hasStrength&&answers[currentIdx].strength===2?'selected':''}" onclick="selectStrength(2)">中等</div>
          <div class="strength-btn ${hasStrength&&answers[currentIdx].strength===3?'selected':''}" onclick="selectStrength(3)">强烈</div>
        </div>
      </div>
      <div style="display:flex; gap:12px; margin-top:28px; justify-content:center;">
        ${currentIdx > 0 ? '<button class="btn btn-secondary" style="width:120px;" onclick="prevQuestion()">上一题</button>' : ''}
        <button class="btn" id="nextBtn" onclick="nextQuestion()" style="width:${currentIdx > 0 ? '160px' : '200px'};${!hasStrength ? 'opacity:.5;cursor:not-allowed;':''}" ${!hasStrength?'disabled':''}>
          ${currentIdx === 27 ? '查看结果' : '下一题'}
        </button>
      </div>
    </div>
  `;
}

function selectChoice(choice) {
  selectedChoice = choice;
  // 保留已有的strength或清除
  if (answers[currentIdx] && answers[currentIdx].choice !== choice) {
    answers[currentIdx].choice = choice;
    answers[currentIdx].strength = null;
  } else if (!answers[currentIdx]) {
    answers[currentIdx] = { choice, strength: null };
  } else {
    answers[currentIdx].choice = choice;
  }
  renderQuestion();
}

function selectStrength(strength) {
  if (!answers[currentIdx]) return;
  answers[currentIdx].strength = strength;
  renderQuestion();
}

function prevQuestion() {
  if (currentIdx > 0) {
    currentIdx--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (!answers[currentIdx] || !answers[currentIdx].strength) return;
  if (currentIdx < 27) {
    currentIdx++;
    renderQuestion();
  } else {
    showResult();
  }
}

// ===== 计分 =====
function calculate() {
  const dims = [
    { a:'E', b:'I', scoreA:0, scoreB:0, pctA:0, pctB:0 },
    { a:'S', b:'N', scoreA:0, scoreB:0, pctA:0, pctB:0 },
    { a:'T', b:'F', scoreA:0, scoreB:0, pctA:0, pctB:0 },
    { a:'J', b:'P', scoreA:0, scoreB:0, pctA:0, pctB:0 },
  ];
  for (const ans of answers) {
    // skip
  }
  // 计算各维度得分
  for (let i = 0; i < answers.length; i++) {
    const d = dims[questions[i].dim];
    if (answers[i].choice === 'a') d.scoreA += answers[i].strength;
    else d.scoreB += answers[i].strength;
  }
  for (const d of dims) {
    const total = d.scoreA + d.scoreB;
    d.pctA = Math.round(d.scoreA / total * 100);
    d.pctB = 100 - d.pctA;
  }
  const type =
    (dims[0].scoreA >= dims[0].scoreB ? 'E' : 'I') +
    (dims[1].scoreA >= dims[1].scoreB ? 'S' : 'N') +
    (dims[2].scoreA >= dims[2].scoreB ? 'T' : 'F') +
    (dims[3].scoreA >= dims[3].scoreB ? 'J' : 'P');
  return { type, dims };
}

// ===== 雷达图绘制 =====
function buildRadarSVG(dims) {
  const cx = 180, cy = 180, maxR = 130;
  const labels = [
    { left:dims[0].a, right:dims[0].b },  // E/I
    { left:dims[1].a, right:dims[1].b },  // S/N
    { left:dims[2].a, right:dims[2].b },  // T/F
    { left:dims[3].a, right:dims[3].b },  // J/P
  ];
  // 每个维度一个轴，分布在四边形
  const angles = [
    -Math.PI/2,        // 上
    0,                 // 右
    Math.PI/2,         // 下
    Math.PI,           // 左
  ];
  // 主标签
  const axisLabels = ['外向 E / 内向 I', '感知 S / 直觉 N', '思考 T / 感受 F', '判断 J / 感知 P'];

  let svg = `<svg class="radar-svg" width="360" height="360" viewBox="0 0 360 360">`;
  // 网格
  for (let r = 1; r <= 4; r++) {
    const rr = maxR * r / 4;
    let pts = '';
    for (let i = 0; i < 4; i++) {
      const x = cx + rr * Math.cos(angles[i]);
      const y = cy + rr * Math.sin(angles[i]);
      pts += `${x},${y} `;
    }
    svg += `<polygon class="grid" points="${pts}" fill="${r===4?'rgba(102,126,234,.05)':'none'}" stroke="#e8e8f0" stroke-width="1"/>`;
  }
  // 轴线
  for (let i = 0; i < 4; i++) {
    const x = cx + maxR * Math.cos(angles[i]);
    const y = cy + maxR * Math.sin(angles[i]);
    svg += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
  }
  // 数据多边形：每个维度取主侧的百分比作为该方向的值
  // 上 = E/I: 用 E 的百分比
  // 右 = S/N: 用 N 的百分比
  // 下 = T/F: 用 F 的百分比
  // 左 = J/P: 用 P 的百分比
  const dataValues = [
    dims[0].pctA / 100,  // E
    dims[1].pctB / 100,  // N
    dims[2].pctB / 100,  // F
    dims[3].pctB / 100,  // P
  ];
  let dataPts = '';
  let dataDots = '';
  for (let i = 0; i < 4; i++) {
    const rr = maxR * dataValues[i];
    const x = cx + rr * Math.cos(angles[i]);
    const y = cy + rr * Math.sin(angles[i]);
    dataPts += `${x},${y} `;
    dataDots += `<circle class="data-dot" cx="${x}" cy="${y}" r="5"/>`;
  }
  svg += `<polygon class="data-line" points="${dataPts}"/>`;
  svg += dataDots;

  // 标签
  const labelPositions = [
    { x: cx, y: 28, anchor:'middle' },           // 上
    { x: 340, y: cy+5, anchor:'end' },           // 右
    { x: cx, y: 348, anchor:'middle' },           // 下
    { x: 20, y: cy+5, anchor:'start' },          // 左
  ];
  for (let i = 0; i < 4; i++) {
    svg += `<text x="${labelPositions[i].x}" y="${labelPositions[i].y}" text-anchor="${labelPositions[i].anchor}" font-size="13" fill="#888">${axisLabels[i]}</text>`;
  }
  svg += `</svg>`;
  return svg;
}
